# Настройки (порт, часовой пояс) задаются в файле .env рядом с этим файлом.
# Сам этот файл менять не нужно: иначе обновление через update.bat не пройдёт.
services:
  sverka:
    build: .
    # Сайт доступен только с этого компьютера: http://localhost:5000
    ports:
      - "127.0.0.1:${SVERKA_PORT:-5000}:5000"
    # База и файлы сверок хранятся в папке data рядом с этим файлом
    volumes:
      - ./data:/data
    environment:
      TZ: ${SVERKA_TZ:-Asia/Baku}   # часовой пояс для времени сверок
    restart: unless-stopped
